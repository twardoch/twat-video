# this_file: mkdocs.yml

site_name: twat-video
site_description: Video processing helpers and AI video adapters for the twat plugin ecosystem
site_url: https://twardoch.github.io/twat-video
repo_url: https://github.com/twardoch/twat-video
repo_name: twardoch/twat-video
docs_dir: src_docs
site_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_bases: true
            show_root_heading: true
            show_if_no_docstring: true
            show_signature_annotations: true
            show_symbol_type_in_heading: true
            separate_signature: true
            group_by_category: true
            merge_init_into_class: true
            show_submodules: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - API Reference:
      - Overview: api.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/twardoch/twat-video
